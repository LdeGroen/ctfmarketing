name: Deploy to Plesk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build
        env:
          # CRA promoveert lint-warnings naar errors als CI=true (GitHub default).
          # We tonen warnings in CI maar laten de build niet falen erop.
          CI: false

      - name: Deploy build/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          security: loose
          timeout: 60000
          local-dir: ./build/
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**

      # Tijdelijk ook naar de nieuwe server (migratie weg van Protagonist,
      # augustus 2026). Zolang de DNS nog naar Plesk wijst is dit een
      # schaduwkopie: de site blijft draaien waar hij draait, maar de nieuwe
      # server heeft altijd dezelfde inhoud. Na het omschakelen vervalt de
      # Plesk-stap hierboven en blijft alleen deze over.
      - name: Ook naar de nieuwe server (rsync over SSH)
        env:
          SSH_KEY: ${{ secrets.NIEUWE_SERVER_KEY }}
          SSH_USER: ${{ secrets.NIEUWE_SERVER_USER }}
          DOEL_PAD: ${{ secrets.NIEUWE_SERVER_PAD }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_USER" ]; then
            echo "nieuwe server nog niet ingesteld — overgeslagen"; exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/nieuw_key
          chmod 600 ~/.ssh/nieuw_key
          rsync -az --delete \
            -e "ssh -i ~/.ssh/nieuw_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./build/ "$SSH_USER@167.233.167.13:htdocs/$DOEL_PAD/"
          echo "gekopieerd naar de nieuwe server: $DOEL_PAD"
